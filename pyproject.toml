[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "UC_AutoMaiL"
version = "0.4.1a1"
description = "Compare machine learning models and report uncertainty in their evaluation"
readme = "PyPI/README.pypi.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=2", "pandas>=2.2", "scipy>=1.14", "scikit-learn>=1.6", "threadpoolctl>=3.2", "openpyxl>=3.1", "matplotlib>=3.9"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/okamasaya/DIY_AutoML"
Documentation = "https://github.com/okamasaya/DIY_AutoML/blob/main/README.en.md"
Issues = "https://github.com/okamasaya/DIY_AutoML/issues"

[project.optional-dependencies]
dl = ["tensorflow-cpu==2.20.0", "keras==3.15.1"]
dev = ["pytest", "build"]
notebook = ["ipykernel>=6", "nbclient>=0.10", "nbformat>=5"]
storage = ["duckdb>=1.4,<2", "pyarrow>=18"]

[project.scripts]
uc-automail = "diy_automl.cli:main"
diy-automl = "diy_automl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
